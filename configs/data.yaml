# Data + feature extraction config. See docs/design/data_pipeline.md.
dataset: oral                     # the only dataset (ear dropped 3 Nov 2026)
raw_dir: data/raw/oral            # labels.json + video-*.mp4 (copied from DL_test1/Task - 2 ORAL/oral)
features_dir: data/features
splits_dir: data/splits

labels:
  positive: Abnormal              # Abnormal = 1 (legacy used Normal = 1; do not copy that)
  normal_value: Normal            # any other interpretation string -> Abnormal

sampling:
  extract_frames: 40              # extract once at T=40; T=20 -> [:, ::2], T=10 -> [:, ::4]
  sequence_lengths: [10, 20, 40]
  method: uniform_linspace
  decode: sequential              # no cap.set() seeking
  short_video: repeat_pad         # never silently drop (3 oral clips report < 40 frames)

frames:
  size: [224, 224]
  color: RGB                      # convert from OpenCV BGR
  interpolation: INTER_AREA
  resize_mode: stretch            # 480x640 portrait -> 224x224 (legacy-compatible)

backbone:
  name: MobileNetV2
  weights: imagenet
  pooling: avg
  preprocess: mobilenet_v2.preprocess_input   # [-1, 1]; NOT /255
  trainable: false
  batch_size: 64
  feature_dim: 1280

splits:
  method: StratifiedKFold
  n_splits: 5
  seeds: [0, 1, 2]                # 0 mandatory; 1,2 if time
  inner_val_fraction: 0.15        # stratified, for early stopping only
