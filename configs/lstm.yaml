# LSTM family. Presets are defined in src/models/lstm.py (PRESETS); this file
# records the training recipe. See docs/design/lstm_design.md.
presets: [lstm_small, lstm_base, bilstm_base]

training:
  loss: binary_crossentropy
  class_weight: balanced
  optimizer: adam
  learning_rate: 1.0e-3
  clipnorm: 1.0
  batch_size: 32
  max_epochs: 100
  early_stopping: {monitor: val_auc, mode: max, patience: 15, restore_best_weights: true}
  reduce_lr_on_plateau: {monitor: val_auc, mode: max, factor: 0.5, patience: 5}
  lr_sensitivity_check: [1.0e-3, 3.0e-4]   # seed-0 inner-val only, then fixed

constraints:
  recurrent_dropout: 0.0          # keep the fused LSTM kernel; non-zero distorts CPU latency
  unroll: false
