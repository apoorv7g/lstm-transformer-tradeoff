# Transformer family (+ hybrid). Presets are defined in src/models/transformer.py
# and src/models/hybrid.py; this file records the training recipe.
# See docs/design/transformer_design.md.
presets: [transformer_small, transformer_base, transformer_deep]
stretch_presets: [hybrid_base]

architecture_defaults:
  norm: pre_ln
  positional_encoding: learned
  pooling: mean
  dropout: 0.1
  ffn_activation: gelu

training:
  loss: binary_crossentropy
  class_weight: balanced
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  clipnorm: 1.0
  warmup_epochs: 5
  batch_size: 32
  max_epochs: 100
  early_stopping: {monitor: val_auc, mode: max, patience: 15, restore_best_weights: true}
  reduce_lr_on_plateau: {monitor: val_auc, mode: max, factor: 0.5, patience: 5}
  lr_sensitivity_check: [1.0e-3, 3.0e-4]
